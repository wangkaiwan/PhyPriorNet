exp_name: proton_ct_prior_gpu_masked_scratch
# Proton-CT (Task3) WITH-PRIOR, FROM SCRATCH, masked prior. User 2026-06-27: retrain from scratch
# (NOT finetune) on the body-mask prior — GPU-PB Hong PB dose with external air (density<0.1, outside
# binary_fill_holes body mask) zeroed; internal cavities kept. WEPL channel = WEPL-fix (corrected
# ray-march). Same from-scratch recipe as proton_ct_prior (lr 1e-4, 120k, in_ch=5), NO init_from.
# Rationale: maskair as a finetune of the unmasked champion gave 96.7 (−0.3) — warm-start fought the
# learned distribution. From scratch lets the net learn directly on the masked prior; also the clean
# basis carried into Task 4 (MRI-proton) per user. Champion to beat = GPU-PB ft + WEPL-fix (97.0).
# Channel stack: [density, corrected-WEPL, pb_prior(GPU, masked), lateral_dist, energy].
