add_naive: true
augment: false
naive_skin_gate: true
patch: [128, 128, 128]
batch_size: 2
fg_prob: 0.7
hi_frac: 0.1
hi_w: 10.0
grad_w: 3.0
het_w: 4.0
lung_w: 2.0
lung_lo: 0.02
lung_hi: 0.6
max_steps: 40000         # finetune only
lr: 5.0e-05              # lower LR for finetune from a good init
weight_decay: 0.0001
ckpt_every: 10000
log_every: 200
