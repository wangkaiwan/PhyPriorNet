# ARM D = base32, init from the DISTILLED student (ARM B) then GT-only finetune (distill_w 0, lower lr,
# fewer steps). = the user's "方案 2 (从蒸馏的模型开始学)". Tests "distill gives good data-efficient
# features; a GT-only finetune then sheds teacher-mimicry bias and beats both plain-distill (B) and
# plain-scratch (C)". My prior: D is the most likely winner. DEPENDS ON ARM B: init_student = B's state.pt.
exp_name: foldexp_ct_f1_D_base32ftgt
fold: 1
modality: ct
in_ch: 6
