# Over-training diagnostic: same recipe as ftg_skinentry_photonct_f1 but run to
# 80000 steps (what all75_p2_ftg used) with snapshots every 2500, so held-out gamma
# can be plotted against step count. all-75 had no valid val set (its 4 val patients
# are all in its train set), so nothing there could ever have caught over-training.
exp_name: ovtrain_ftg_f1
fold: 1
modality: ct
in_ch: 6
add_naive: true
bottleneck: dilated
base_ch: 48
augment: false
grad_w: 3.0
het_w: 4.0
lung_w: 2.0
lung_lo: 0.02
lung_hi: 0.6
patch:
- 128
- 128
- 128
batch_size: 2
fg_prob: 0.7
max_steps: 80000
lr: 3.0e-05
weight_decay: 0.0001
hi_frac: 0.1
hi_w: 10.0
gamma_w: 0.0
dose_spacing_mm: 2.0
ckpt_every: 5000
log_every: 200
val_every: 5000
val_crops: 240
val_gamma_crops: 0
levels: 4
num_workers: 4
wandb: true
wandb_project: doserad2026
cache_dir: /home/kaiwang/doserad2026_workdir/cache/crops/photon_skinentry_ssd
splits: /home/kaiwang/doserad2026_workdir/splits_final.json
run_root: /home/kaiwang/doserad2026_workdir/runs
init_from: /home/kaiwang/doserad2026_workdir/runs/ft_skinentry_photonct_f1/state.pt
naive_skin_gate: true
snap_every: 2500
