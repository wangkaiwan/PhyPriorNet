exp_name: mri_dose_exp3b_mri_sct_phys_naive
# EXP3b: "treat sCT as CT, run the FULL v13 channel set, plus MRI + raw sCT".
# Channels [MRI, sCT, density, rdepth, fluence, dist_to_cax, source_dist, naive_prior], in_ch=8.
# density/rdepth/fluence/naive are recomputed FROM the v4 sCT (no GT-CT leakage); the physics
# channels come from the photon_sct_v4 crop cache and naive is derived on-the-fly from them.
# v13 PARITY: identical arch (dilated bottleneck), weighting, val metrics, wandb fields,
# OneCycle, resumable state.pt — the ONLY difference vs exp1/exp2/v13 is the INPUT channel set.
mode: mri_sct_phys_naive
modality: mri
in_ch: 8
fold: 0
bottleneck: dilated
patch: [128, 128, 128]
batch_size: 2
fg_prob: 0.7
grad_w: 3.0
het_w: 4.0
lung_w: 2.0
lung_lo: 0.02
lung_hi: 0.6
hi_frac: 0.1
hi_w: 10.0
gamma_w: 0.0
dose_spacing_mm: 2.0
lr: 1.0e-4
weight_decay: 1.0e-4
max_steps: 120000
log_every: 200
ckpt_every: 5000
val_every: 5000
val_crops: 240
val_gamma_crops: 0
base_ch: 48
levels: 4
num_workers: 2
wandb: true
wandb_project: doserad2026
cache_dir: /home/kaiwang/doserad2026_workdir/cache/crops/photon
sct_dir: /data/kwang/sct_dose/v4_sct
sct_phys_dir: /home/kaiwang/doserad2026_workdir/cache/crops/photon_sct_v4
splits: /home/kaiwang/doserad2026_workdir/splits_final.json
run_root: /home/kaiwang/doserad2026_workdir/runs
