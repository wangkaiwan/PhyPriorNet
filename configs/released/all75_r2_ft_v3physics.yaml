# ENGINE-V2 net: finetune the deployed proton dose net (all75_r2_ft) on V3 (parallel-column BEV)
# WEPL/prior channels — train/deploy consistency at the engine-v2 physics. Only wepl_dir/prior_dir
# changed to the v3 rebuilds (GT dose + density/lateral/energy channels untouched). Recipe mirrors
# the r2->r2_ft finetune stage. GOAL: recover engine v2's −2.3γ plug-in gap (96.85 -> ~99).
exp_name: all75_r2_ft_v3physics
modality: proton
in_ch: 5
fold: all
bottleneck: dilated
patch: [32, 128, 128]
batch_size: 4
fg_prob: 0.7
grad_w: 3.0
het_w: 4.0
lung_w: 2.0
lung_lo: 0.02
lung_hi: 0.6
hi_frac: 0.1
hi_w: 10.0
lr: 2.0e-05
weight_decay: 1.0e-04
max_steps: 40000
log_every: 200
ckpt_every: 5000
val_every: 5000
val_crops: 240
base_ch: 48
levels: 4
num_workers: 8
init_from: ${WORKDIR}/runs/all75_r2_ft/state.pt
wandb: true
wandb_project: doserad2026
cache_dir: ${WORKDIR}/cache/crops/proton_ssd
prior_dir: ${WORKDIR}/cache/crops/proton_prior_v3
wepl_dir: ${WORKDIR}/cache/crops/proton_weplfix_v3
splits: ${WORKDIR}/splits_all75.json
run_root: ${WORKDIR}/runs
snap_every: 5000
