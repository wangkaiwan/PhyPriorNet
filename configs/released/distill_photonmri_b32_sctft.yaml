# sCT-domain adaptation of the photon-CT b32 D-ft student (2026-08-27): the CT-domain student is
# −4.07 gamma when stitched behind the MRI front-end (never saw sCT channels). Fix = GT-only ft on
# the sCT-domain cache (deployed MRI front-end synth_density -> skinentry channels on m24 bboxes),
# same proven D-ft hypers. Gate: stitched held16 gamma drop <= 1.5 vs deployed photon-MRI, else no ship.
exp_name: distill_photonmri_b32_sctft_v2
fold: all
modality: ct
in_ch: 6
base_ch: 32
levels: 4
bottleneck: dilated
distill_w: 0.0
init_student: ${WORKDIR}/runs/distill_photonct_b32_from4018_Dft/state.pt
add_naive: true
augment: false
naive_skin_gate: true
patch: [128, 128, 128]
batch_size: 2
fg_prob: 0.7
hi_frac: 0.1
hi_w: 10.0
grad_w: 3.0
het_w: 4.0
lung_w: 2.0
lung_lo: 0.02
lung_hi: 0.6
max_steps: 40000
lr: 5.0e-05
weight_decay: 0.0001
ckpt_every: 5000
log_every: 200
cache_dir: ${WORKDIR}/cache/crops/photon_skinentry_sct_m24
splits: ${WORKDIR}/splits_all75.json
run_root: ${WORKDIR}/runs
wandb: true
wandb_project: doserad2026
