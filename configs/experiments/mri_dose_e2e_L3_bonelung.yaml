exp_name: mri_dose_e2e_L3_bonelung
# LEVER 3 (region-weighted sCT anchor) on top of variant C (frozen v13, only synth trains via dose loss).
# Bone error is a systematic UNDER-estimation bias (ME -345 HU ~= MAE) -> upweighting bone in the sCT
# anchor should shave it. Lung error is high-variance/no-bias -> weighting helps little (expected; this
# run is the controlled test of that diagnosis). Same as C lam0.3 otherwise; sct_w_* default to 1.0
# (=A/B/C) elsewhere.
modality: mri
in_ch: 6                 # dose net = v13 layout [density,rdepth,fluence,dist,source,naive]
fold: 0
bottleneck: dilated
base_ch: 48
levels: 4
patch: 128
k_cps: 2
lam_sct: 0.3             # keep C lam0.3 (best dose) as the base
sct_w_bone: 6.0          # lever 3: emphasise bone (CT>200 HU) in the sCT anchor
sct_w_lung: 3.0          # lever 3: emphasise lung/air (CT<-300 HU, in body)
grad_w: 3.0
het_w: 4.0
lung_w: 2.0
lung_lo: 0.02
lung_hi: 0.6
hi_frac: 0.1
hi_w: 10.0
lr: 2.0e-5
weight_decay: 1.0e-4
max_steps: 20000
log_every: 100
ckpt_every: 2500
val_every: 2500
val_cps: 32
num_workers: 0
wandb: true
wandb_project: doserad2026
synth_ckpt: /data/kwang/sct_paired_runs/v4/best.pt
dose_ckpt: /home/kaiwang/doserad2026_workdir/runs/v13ft_photon_ct_dilated_hardregions/state.pt
cache_dir: /home/kaiwang/doserad2026_workdir/cache/crops/photon
splits: /home/kaiwang/doserad2026_workdir/splits_final.json
run_root: /home/kaiwang/doserad2026_workdir/runs
root_dir: /data/kwang/DoseRad2026_raw/photon/training
freeze_dose: true
