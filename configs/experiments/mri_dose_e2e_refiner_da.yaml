exp_name: mri_dose_e2e_refiner_da
# DOSE-AWARE classify-then-regress refiner = variant C mechanism applied to the 2-ch refiner.
# synth = [MR, coarse CT] -> sCT (warm-start from the image-only refiner); frozen v13 dose engine;
# loss = dose weighted-L1 (back-prop through diff physics into the refiner) + lam * region-weighted
# sCT anchor. Goal: keep the coarse-CT bone prior AND push lung (dose-sensitive) via the dose loss.
modality: mri
in_ch: 6                 # dose net = v13 layout
synth_in_ch: 2          # refiner takes [MR, coarse CT]
coarse_dir: /data/kwang/doserad_cache_archive/coarse_ct_v1
fold: 0
bottleneck: dilated
base_ch: 48
levels: 4
patch: 128
k_cps: 2
lam_sct: 0.3
sct_w_bone: 6.0
sct_w_lung: 3.0
grad_w: 3.0
het_w: 4.0
lung_w: 2.0
lung_lo: 0.02
lung_hi: 0.6
hi_frac: 0.1
hi_w: 10.0
lr: 2.0e-5
weight_decay: 1.0e-4
max_steps: 20000
log_every: 100
ckpt_every: 2500
val_every: 2500
val_cps: 32
num_workers: 0
wandb: true
