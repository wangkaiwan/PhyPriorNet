exp_name: v8_photon_ct_naive_gradw
fold: 0
modality: ct
in_ch: 6               # 5 physics channels + naive_dose (same as v6)
add_naive: true
augment: false         # isolate the grad-weighting effect vs v6 (no aug confound)
grad_w: 5.0            # penumbra weighting: +up-to-5x extra L1 weight on steep GT dose-gradient
