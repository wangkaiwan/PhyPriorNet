batch_size: 2
fg_prob: 0.7
max_steps: 120000
lr: 3.0e-4
weight_decay: 1.0e-4
hi_frac: 0.1
hi_w: 10.0
gamma_w: 0.0
dose_spacing_mm: 2.0
ckpt_every: 200
val_every: 4000
val_crops: 24
val_gamma_crops: 6
base_ch: 48
levels: 4
num_workers: 4
wandb: true
wandb_project: doserad2026
