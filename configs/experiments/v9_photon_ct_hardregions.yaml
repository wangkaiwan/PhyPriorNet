exp_name: v9_photon_ct_hardregions
fold: 0
modality: ct
in_ch: 6               # v6 base: 5 physics channels + naive_dose
add_naive: true
augment: false         # isolate the hard-region weighting effect vs v6
# Hard-region loss weighting (clinically-highest-error regions; see dose-hard-regions memory):
# Diagnostic (2026-06-12): the failing thorax patients have ~30% lung + ~22% AIR in their
# HIGH-DOSE region (vs ~0% for solved abdomen patients) → low-density is THE driver.
grad_w: 3.0            # penumbra (dose-gradient / field edges)
het_w: 4.0             # bone/soft-tissue/lung/air INTERFACES (density-gradient)
lung_w: 2.0            # LUNG + very-low-density (density in [0.02, 0.6] g/cm^3; lowered from 0.05
                       # to include the air-adjacent low-density that dominates the hard region)
lung_lo: 0.02
lung_hi: 0.6
patch: [128, 128, 128]
batch_size: 2
fg_prob: 0.7
max_steps: 120000
lr: 3.0e-4
weight_decay: 1.0e-4
hi_frac: 0.1
hi_w: 10.0
gamma_w: 0.0
dose_spacing_mm: 2.0
ckpt_every: 200
val_every: 4000
val_crops: 24
val_gamma_crops: 6
base_ch: 48
levels: 4
num_workers: 4
wandb: true
wandb_project: doserad2026
