# Proton-MRI E2E on the NATIVE 1x1x3 pipeline, DOUBLE-Gaussian variant (2026-08-10).
# Same as e2e_1x1x3_whole_protonmri.yaml EXCEPT dose <- all75_r2_ft_double (the double-Gaussian proton-CT
# dose net). MUST run with env DOSERAD_LATERAL_DOUBLE=1 so the on-the-fly skin-entry PB prior used in
# training is the Hong double-Gaussian (matches how all75_r2_ft_double was finetuned) — a CLEAN test of
# "does the double-Gaussian nuclear-halo prior help proton-MRI" (retrained E2E, not a mismatched swap).
exp_name: e2e_1x1x3_whole_protonmri_double
modality: proton
in_ch: 5
synth_in_ch: 2
base_ch: 48
levels: 4
bottleneck: dilated
fold: all
patch: [32, 128, 128]
k_cps: 2
fg_prob: 0.7
hi_frac: 0.1
hi_w: 10.0
grad_w: 3.0
het_w: 4.0
lung_w: 2.0
lung_lo: 0.02
lung_hi: 0.6
lam_sct: 0.5
wepl_w: 0.5
lr: 2.0e-05
weight_decay: 0.0001
max_steps: 40000
log_every: 100
ckpt_every: 5000
val_every: 5000
wandb: true
wandb_project: doserad2026
native_synth: true
coarse_dir: /data/kwang/coarse_ct_1x1x3_samefield_whole_soft
cache_dir: /home/kaiwang/doserad2026_workdir/cache/crops/proton_ssd
wepl_dir: /home/kaiwang/doserad2026_workdir/cache/crops/proton_weplfix_ssd
splits: /home/kaiwang/doserad2026_workdir/splits_all75.json
run_root: /home/kaiwang/doserad2026_workdir/runs
synth_ckpt: /data/kwang/sct_refine_runs/ref_1x1x3_samefield_whole2/synth_ckpt.pt
dose_ckpt: /home/kaiwang/doserad2026_workdir/runs/all75_r2_ft_double/best.pt
freeze_synth: false
density_direct: true
skin_entry: true
mr_aug:
  bias: 0.5
  gamma: [0.6, 1.7]
  noise: 0.04
vol_cache_n: 80   # cache ALL 75 patients' CPU arrays (mr01/coarse01/dens01+geoms); grid rebuilt per step.
                  # kills the ~2.4s/step load_vol MISS (85% of step time) -> ~5-6x after a ~75-step warmup.
