# Proton-MRI MULTIMODAL (ct_mix) continued finetune, 40k — user directive 2026-08-18 overnight ("continue
# training + multimodal", the proton analog of the photon m24L_p4_mmB_ft40k). = all75_r3ft_mm_protonmri
# recipe (warm-start the deployed best all75_r3ft_mraug = leaderboard 79.34; ct_mix 0.5 interleaves real
# proton-CT dose-net steps; shift-robust mraug coarse; mr_aug) but max_steps 40000 + vol_cache_n=80 (6x fast
# trainer). Then held16 eval vs the 79.34 lineage. NOTE: in-sample held16 is fantasy for proton-MRI — the
# real read is the leaderboard; this tests whether more multimodal training helps before spending a slot.
