# Margin-8 FINETUNE of the deployed BEST photon-CT (4018f597) — to test whether training at margin-8
# (learning the tight crop's boundary) beats running the margin-24-trained model at margin-8 inference
# (which showed a ~5% crop-edge boundary artifact). Same arch/loss as m24_p2_ftg; only cache = the
# rebuilt margin-8 crops (photon_skinentry_m8) and init_from = the best model. 20k finetune steps.
exp_name: ftm8_from_best
fold: all
modality: ct
in_ch: 6
add_naive: true
bottleneck: dilated
base_ch: 48
augment: false
grad_w: 3.0
het_w: 4.0
lung_w: 2.0
lung_lo: 0.02
lung_hi: 0.6
patch:
- 128
- 128
- 128
batch_size: 2
fg_prob: 0.7
max_steps: 20000
lr: 3.0e-05
weight_decay: 0.0001
hi_frac: 0.1
hi_w: 10.0
gamma_w: 0.0
dose_spacing_mm: 2.0
ckpt_every: 5000
log_every: 200
val_every: 5000
val_crops: 240
val_gamma_crops: 0
levels: 4
num_workers: 4
wandb: false
cache_dir: /home/kaiwang/doserad2026_workdir/cache/crops/photon_skinentry_m8
splits: /home/kaiwang/doserad2026_workdir/splits_all75.json
run_root: /home/kaiwang/doserad2026_workdir/runs
init_from: /home/kaiwang/doserad2026_workdir/runs/docker_extracted/photon_ct_docker.pt
naive_skin_gate: true
snap_every: 5000
