fg_prob: 0.7
hi_frac: 0.1
hi_w: 10.0
grad_w: 3.0
het_w: 4.0
lung_w: 2.0
lung_lo: 0.02
lung_hi: 0.6
lam_sct: 0.5
wepl_w: 0.5
lr: 2.0e-05
weight_decay: 0.0001
max_steps: 20000
log_every: 100
ckpt_every: 2500
val_every: 2500
wandb: true
wandb_project: doserad2026
coarse_dir: /data/kwang/doserad_cache_archive/coarse_ct_whole_soft_mraug
