# Proton-MRI JOINT E2E finetune on the NEW shift-robust clf's coarse + MR-intensity aug.
# Warm-start full synth+dose from all75_r3; coarse regenerated by clf_whole_mraug; synth+dose adapt to
# the new coarse (train/deploy consistency) AND learn MR-intensity invariance. Baseline to beat: 94.8
# (all75_r3 native, held16). mr_aug = MR-input intensity only (safe; not geometric).
